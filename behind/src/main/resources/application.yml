server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: campusnexus
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campusnexus?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      timeout: 3s
      database: 3
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    init-username: ${ADMIN_INIT_USERNAME:admin}
    init-password: ${ADMIN_INIT_PASSWORD:123456}
  storage:
    type: ${STORAGE_TYPE:oss}
    local-path: ${STORAGE_LOCAL_PATH:./data/uploads}
    public-prefix: /uploads
  import:
    segment-chars: ${IMPORT_SEGMENT_CHARS:4000}
    max-sections: ${IMPORT_MAX_SECTIONS:20}
    max-knowledge: ${IMPORT_MAX_KNOWLEDGE:200}
  ai:
    enabled: ${AI_ENABLED:true}
    base-url: ${AI_BASE_URL:https://ws-qxm9gwdvfn7tutcv.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
    api-key: ${API_KEY}
    model: ${AI_MODEL:qwen3.5-plus}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:120}
    max-retries: ${AI_MAX_RETRIES:1}
    max-items-per-section: ${AI_MAX_ITEMS_PER_SECTION:8}
    embedding:
      enabled: ${AI_EMBEDDING_ENABLED:true}
      base-url: ${EMBEDDING_BASE_URL:${AI_BASE_URL:https://ws-qxm9gwdvfn7tutcv.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}}
      api-key: ${EMBEDDING_API_KEY:${API_KEY}}
      model: ${EMBEDDING_MODEL:qwen3.7-text-embedding}
      dimension: ${EMBEDDING_DIMENSION:1024}
      timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:60}
      max-retries: ${EMBEDDING_MAX_RETRIES:2}
  vector:
    enabled: ${VECTOR_ENABLED:true}
    chroma-url: ${CHROMA_URL:http://localhost:8000}
    collection: ${CHROMA_COLLECTION:campus_knowledge_v1}
    api-version: ${CHROMA_API_VERSION:V1}
    tenant: ${CHROMA_TENANT:default}
    database: ${CHROMA_DATABASE:default}
    batch-size: ${VECTOR_BATCH_SIZE:20}
    max-retries: ${VECTOR_MAX_RETRIES:2}
    chunk-chars: ${VECTOR_CHUNK_CHARS:500}
    chunk-overlap: ${VECTOR_CHUNK_OVERLAP:50}
    timeout-seconds: ${CHROMA_TIMEOUT_SECONDS:30}
  chat:
    rate-limit-per-minute: ${RATE_CHAT_PER_MINUTE:10}
    top-k: ${CHAT_TOP_K:5}
    vector-candidates: ${CHAT_VECTOR_CANDIDATES:60}
    vector-min-score: ${CHAT_VECTOR_MIN_SCORE:0.75}
    keyword-candidates: ${CHAT_KEYWORD_CANDIDATES:200}
    fulltext-enabled: ${CHAT_FULLTEXT_ENABLED:false}
    keyword-base-weight: ${CHAT_KEYWORD_BASE_WEIGHT:0.55}
    keyword-coverage-weight: ${CHAT_KEYWORD_COVERAGE_WEIGHT:0.25}
    keyword-phrase-weight: ${CHAT_KEYWORD_PHRASE_WEIGHT:0.15}
    keyword-popularity-weight: ${CHAT_KEYWORD_POPULARITY_WEIGHT:0.05}
    keyword-min-score: ${CHAT_KEYWORD_MIN_SCORE:0.3}
    general-answer-min-score: ${CHAT_GENERAL_ANSWER_MIN_SCORE:0.3}
    relevance-judge-enabled: ${CHAT_RELEVANCE_JUDGE_ENABLED:true}
    context-max-chars: ${CHAT_CONTEXT_MAX_CHARS:2400}
    decomposition-threshold: ${CHAT_DECOMPOSITION_THRESHOLD:50}
    max-question-length: ${CHAT_MAX_QUESTION_LENGTH:500}
    max-history-limit: ${CHAT_MAX_HISTORY_LIMIT:100}
    allow-general-answer: ${CHAT_ALLOW_GENERAL_ANSWER:true}
    history-turns: ${CHAT_HISTORY_TURNS:3}
    history-max-chars: ${CHAT_HISTORY_MAX_CHARS:1200}
    sse-timeout-millis: ${CHAT_SSE_TIMEOUT_MILLIS:300000}
    keep-alive-millis: ${CHAT_KEEP_ALIVE_MILLIS:15000}
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketname: campus--nexus
    region: cn-beijing
    accesskeyid: ${OSS_ACCESS_KEY_ID}
    accesskeysecret: ${OSS_ACCESS_KEY_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info
    com.campusnexus: info
